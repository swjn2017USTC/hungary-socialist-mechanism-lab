- source_id: mnb_official_fx
  institution: Magyar Nemzeti Bank (MNB)
  dataset: Official USD historical exchange rates (1985 HTML query)
  locator: https://www.mnb.hu/en/arfolyam-lekerdezes
  expected_format:
  - HTML
  - SOAP/XML
  expected_roles:
  - exogenous_forcing
  retrieval_method: single HTTPS GET of the official public exchange-rate query page
  access_status: public_metadata
  audit_status: metadata_checked
  rights:
    license_status: restricted
    license_name: MNB legal notice §1 (attribution, unchanged content)
    terms_locator: https://www.mnb.hu/a-jegybank/informaciok-a-jegybankrol/gyakorlati-tudnivalok/jogi-nyilatkozat
    evidence_quote: '§1: ''változatlan tartalommal, a forrás megjelölésével szabadon terjeszthetők'' (absent
      other regulation, distributable unchanged with source attribution).'
    checked_at: '2026-10-07T00:00:00Z'
    download_allowed: true
    redistribution_allowed: false
    notes: 'Grant covers downloading the official public quotes and local numeric re-arrangement without
      altering economic content. Redistribution stays conservatively blocked: raw or normalized MNB data
      and publicly transformed data are not submitted or published from this project. See the legal notice
      at terms_locator.'
  coverage_notes: Official public daily USD quotes; first batch = 1985 (03 Jan 1985 = 51.30 HUF/USD, 244
    quotes). 1957 queries return no rows - the 1949 catalogue start is not USD coverage.
  notes: Official FX channel only; never the sole trade exchange rate (BASELINE §21 error 3). The former
    SOAP web-service PDF (https://www.mnb.hu/letoltes/documentation-on-the-mnb-s-web-service-on-current-and-historic-exchange-rates.pdf)
    is background reference only; its GetExchangeRates 404s and it is not the download payload locator.
