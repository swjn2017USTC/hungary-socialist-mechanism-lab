schema_version: '1'
# P04 discrete external history (BASELINE §14.2).  Every event acts ONLY through
# explicit signal channels; there is no "event -> support +20" patch.  Quarter
# boundaries are locally reconstructed chronology unless a source fixes them;
# economic channels reference the continuous external series and never add a
# second shock on top of the series themselves.
events:
  - event_id: post1956_stabilization
    start: 1957Q1
    end: 1960Q4
    date_precision: reconstructed_quarter
    date_evidence:
      - "BASELINE §14.2 item 1 (1957-60 regime re-stabilisation)"
    economic_series_refs: []
    signal_channels: [regime_threat, public_action_risk]
    mapping_parameter_paths:
      - p04.external_recipe.default_loading
    notes: "Regime consolidation signal; no direct quantity patch."

  - event_id: soviet_energy_network
    start: 1960Q1
    end: 1964Q4
    date_precision: reconstructed_quarter
    date_evidence:
      - "BASELINE §14.2 item 2 (Soviet hydrocarbon / CMEA energy network expansion)"
    economic_series_refs: [soviet_energy_availability]
    signal_channels: [official_policy]
    mapping_parameter_paths:
      - p04.external_recipe.base_energy_quota
    notes: "Annotates the structural Soviet energy quota recipe; no second quantity shock."

  - event_id: prague_spring
    start: 1968Q1
    end: 1968Q2
    date_precision: exact_quarter
    date_evidence:
      - "BASELINE §14.2 item 3 (1968Q1 Prague Spring)"
    economic_series_refs: []
    signal_channels: [opposition_success]
    mapping_parameter_paths:
      - p04.external_recipe.default_loading
    notes: "Reform possibility / neighbourhood efficacy signal only."

