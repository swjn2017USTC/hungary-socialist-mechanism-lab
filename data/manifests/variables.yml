schema_version: '1'
variables:
- aggregation: mean
  allowed_roles:
  - exogenous_forcing
  notes: World Bank Pink Sheet monthly crude oil (average), nominal USD per barrel.
    Observed forcing from 1960-01; 1957-1959 must be an explicit structural warm-up,
    never backfilled observations.
  original_frequency: monthly
  semantic_kind: external
  unit: USD_per_barrel
  variable_id: world_oil_price
- aggregation: mean
  allowed_roles:
  - exogenous_forcing
  notes: 'Global USD interest-rate forcing: Federal Reserve H.15 RIFSPFF_N.M effective
    federal funds rate (percent per year). Same-origin substitute for the rights-blocked
    FRED FEDFUNDS candidate.'
  original_frequency: monthly
  semantic_kind: external
  unit: percent_per_year
  variable_id: global_usd_rate
- aggregation: end_of_period
  allowed_roles:
  - exogenous_forcing
  notes: 'Official MNB HUF/USD daily quotes (page already normalized to HUF per 1
    USD; never divided by 100). First batch is 1985 only; quarter diagnostics take
    the last actual quote per quarter, missing dates stay missing. NOT the sole trade
    exchange rate: convertible, transferable rouble, bilateral CMEA settlement and
    domestic admin prices are distinct (BASELINE §21 error 3).'
  original_frequency: dated
  semantic_kind: external
  unit: HUF_per_USD
  variable_id: official_fx
- aggregation: mean
  allowed_roles:
  - target
  notes: Annual GDP index (1960=100) from KSH gdp0002; quarterly simulation aggregates
    to annual by mean for comparison. Never forced into state; gross material output
    is never passed off as GDP.
  original_frequency: annual
  semantic_kind: outcome
  unit: index_1960_100
  variable_id: gdp
- aggregation: mean
  allowed_roles:
  - target
  notes: Household actual final consumption index (1960=100) from KSH gdp0002; comparison
    only.
  original_frequency: annual
  semantic_kind: outcome
  unit: index_1960_100
  variable_id: consumption
- aggregation: mean
  allowed_roles:
  - target
  notes: Gross fixed capital formation index (1960=100) from KSH gdp0002; comparison
    only. Must not double as forcing (BASELINE §21 error 1).
  original_frequency: annual
  semantic_kind: outcome
  unit: index_1960_100
  variable_id: investment
- aggregation: null
  allowed_roles:
  - target
  notes: Annual target from 1960.
  original_frequency: annual
  semantic_kind: outcome
  unit: null
  variable_id: wage
- aggregation: null
  allowed_roles:
  - target
  notes: Administrative price index target; not a scarcity measure (BASELINE §21 error
    4).
  original_frequency: annual
  semantic_kind: outcome
  unit: null
  variable_id: cpi
- aggregation: mean
  allowed_roles:
  - target
  notes: Volume index of industrial production (1960=100, KSH ipa0002; 1985=346).
    Independent of the five featured physical product variables; not one aggregated
    'goods'.
  original_frequency: annual
  semantic_kind: outcome
  unit: index_1960_100
  variable_id: industrial_output
- aggregation: null
  allowed_roles:
  - target
  notes: Annual external-trade target; comparison only.
  original_frequency: annual
  semantic_kind: outcome
  unit: null
  variable_id: trade
- aggregation: null
  allowed_roles:
  - target
  notes: Annual target; hard-currency debt context.
  original_frequency: annual
  semantic_kind: outcome
  unit: null
  variable_id: debt
- aggregation: null
  allowed_roles:
  - target
  notes: Annual target.
  original_frequency: annual
  semantic_kind: outcome
  unit: null
  variable_id: housing
- aggregation: null
  allowed_roles:
  - target
  notes: Annual retail target; commodity-level shortage proxy availability still open
    (BASELINE §41).
  original_frequency: annual
  semantic_kind: outcome
  unit: null
  variable_id: retail
- aggregation: null
  allowed_roles:
  - target
  notes: Annual target.
  original_frequency: annual
  semantic_kind: outcome
  unit: null
  variable_id: employment
- aggregation: end_of_period
  allowed_roles:
  - initial_state
  notes: Census population stocks; anchors only at true census dates (BASELINE §24).
    Grade rules per BASELINE §5.3.
  original_frequency: dated
  semantic_kind: initial_anchor
  unit: persons
  variable_id: population_anchor
- aggregation: piecewise_constant
  allowed_roles:
  - exogenous_forcing
  notes: 'RECONSTRUCTED ONLY: never an observed series (evidence_status must be ''reconstructed''
    at admission). original_frequency is monthly because the reconstruction input
    is the admitted WB monthly oil workbook; the cmea_five_year_contract transform
    (monthly->quarterly, piecewise_constant, five complete past years only) produces
    the 1975Q1-1985Q4 quarterly artifact. 1957-1974 is the separate p02_cmea_contract_prior
    latent prior, never this variable.'
  original_frequency: monthly
  semantic_kind: external
  unit: cmea_settlement_unit_per_p02_energy_unit
  variable_id: cmea_energy_price
- aggregation: sum
  allowed_roles:
  - target
  notes: KSH ipa0002 gross electricity production (1960 = 7617 million kWh); physical
    energy-group outcome, annual sum.
  original_frequency: annual
  semantic_kind: outcome
  unit: million_kWh
  variable_id: industrial_electricity
- aggregation: sum
  allowed_roles:
  - target
  notes: KSH ipa0002 crude steel (1960 = 1887 thousand tonnes); raw-materials group
    outcome, annual sum.
  original_frequency: annual
  semantic_kind: outcome
  unit: thousand_tonnes
  variable_id: industrial_crude_steel
- aggregation: sum
  allowed_roles:
  - target
  notes: KSH ipa0002 mineral or chemical fertilizers (1960 = 102 thousand tonnes).
    The CSV does not declare active-substance content, so the unit is kept as published;
    raw-materials group, annual sum.
  original_frequency: annual
  semantic_kind: outcome
  unit: thousand_tonnes
  variable_id: industrial_fertilizer
- aggregation: sum
  allowed_roles:
  - target
  notes: KSH ipa0002 cement (1960 = 1571 thousand tonnes); a construction input, not
    completed housing; raw-materials group, annual sum.
  original_frequency: annual
  semantic_kind: outcome
  unit: thousand_tonnes
  variable_id: industrial_cement
- aggregation: sum
  allowed_roles:
  - target
  notes: KSH ipa0002 television sets (1960 = 139 thousand units); durable-goods group
    outcome, annual sum.
  original_frequency: annual
  semantic_kind: outcome
  unit: thousand_units
  variable_id: industrial_television
- aggregation: sum
  allowed_roles:
  - target
  notes: KSH h_omf001b cereals total (1960 = 6960 thousand tonnes); food (raw) harvest
    outcome, annual sum. Never used to schedule actual farm output.
  original_frequency: annual
  semantic_kind: outcome
  unit: thousand_tonnes
  variable_id: ag_cereals
- aggregation: sum
  allowed_roles:
  - target
  notes: KSH h_omf001b wheat (1960 = 1803 thousand tonnes); food (raw) harvest outcome,
    annual sum.
  original_frequency: annual
  semantic_kind: outcome
  unit: thousand_tonnes
  variable_id: ag_wheat
- aggregation: sum
  allowed_roles:
  - target
  notes: KSH h_omf001b maize (1960 = 3534 thousand tonnes); food (raw) harvest outcome,
    annual sum.
  original_frequency: annual
  semantic_kind: outcome
  unit: thousand_tonnes
  variable_id: ag_maize
- aggregation: mean
  allowed_roles:
  - target
  notes: KSH h_qkt001 volume index of goods imports (1960 = 100%, 1961 = 108); annual
    mean. An import outcome, never an imports quota; CMEA composition is never inferred
    from the total index.
  original_frequency: annual
  semantic_kind: outcome
  unit: index_1960_100
  variable_id: trade_import_volume_index
- aggregation: mean
  allowed_roles:
  - target
  notes: KSH h_qkt001 volume index of goods exports (1960 = 100%, 1961 = 118); annual
    mean.
  original_frequency: annual
  semantic_kind: outcome
  unit: index_1960_100
  variable_id: trade_export_volume_index
- aggregation: null
  allowed_roles:
  - latent_parameter
  notes: 'Soft budget constraint strength latent parameter: literature prior + calibration
    + sensitivity + uncertainty required; never observed evidence (BASELINE §22.5).'
  original_frequency: static
  semantic_kind: latent
  unit: null
  variable_id: sbc_strength
- aggregation: null
  allowed_roles:
  - latent_parameter
  notes: Structural warm-up oil price for 1957Q1-1959Q4 (no observed World Bank oil
    before 1960-01; observations are never backfilled). Selected value 1.6 with engineering
    bounds [1, 3]; not calibrated.
  original_frequency: static
  semantic_kind: latent
  unit: USD_per_barrel
  variable_id: oil_warmup_price
- aggregation: null
  allowed_roles:
  - latent_parameter
  notes: Early CMEA base contract price prior covering 1957-1974, before the five-year
    reconstruction window starts 1975Q1. Bounds [0.5, 1.5]; not a calibrated estimate.
  original_frequency: static
  semantic_kind: latent
  unit: cmea_settlement_unit_per_p02_energy_unit
  variable_id: cmea_base_energy_price
- aggregation: null
  allowed_roles:
  - latent_parameter
  notes: Multiplier scaling the five-year-rule CMEA contract price reconstruction;
    selected value 1.0 with engineering bounds [0.5, 1.5]; not calibrated.
  original_frequency: static
  semantic_kind: latent
  unit: ratio
  variable_id: cmea_uncertainty_multiplier
- aggregation: null
  allowed_roles:
  - latent_parameter
