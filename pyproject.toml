[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hsm-lab"
version = "0.1.0"
description = "Hungary socialist mechanism lab - research simulation foundation (P00)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "polars>=1,<2",
    "duckdb>=1,<2",
    "pyarrow>=18",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "socioverse2==0.2.0",
    "networkx>=3,<4",
    "SALib>=1.5,<2",
    "pyabc>=0.12,<1",
    "typer>=0.12,<1",
]

[project.scripts]
hsm = "hsm_lab.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hsm_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


[tool.ruff.lint.per-file-ignores]
# Typer's idiom is Option(...) in defaults; B008 flags the standard pattern.
"src/hsm_lab/cli/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/hsm_lab"]
